name: CI

# Green/red gate for every PR and every push to main. The `lint` and `test`
# jobs below are headless and PDK-free: they run on a bare ubuntu runner with
# nothing but python3 (stdlib) and shellcheck, so a PR is never blocked on
# downloading a ~1 GB PDK or on building xschem. The `tmds-encoder-verification`
# job runs the RTL/cocotb bench and is unaffected by the sim-harness jobs.
#
# | Self-check                                   | Needs        | Runs in        |
# |----------------------------------------------|--------------|-----------------|
# | RTL encoder + cocotb bench + negative control | iverilog/yosys/cocotb | `tmds-encoder-verification` |
# | `.github/scripts/lint.sh`                     | python3      | `lint` (here)  |
# | evidence-record format + append-only          | python3+git  | `lint` (here)  |
# | LVS signoff verdicts + negative controls      | python3      | `lint` (here)  |
# | testbench manifests load (`--list`)           | python3      | `test` (here)  |
# | LVS signoff-guard unit tests (layout/tests)   | python3      | `test` (here)  |
#
# Deliberate exclusion: actually *running* the PVT (x rate) sweep needs
# ngspice and the gf180mcu PDK, neither of which belongs on the
# pull_request path (a multi-GB PDK fetch should not gate every PR).
# `--check-env` is exercised here but its exit code is not gated on, since
# this runner never has the PDK installed -- it is expected to report
# "PDK: MISSING" with the install hint, which is the documented, correct
# behavior (sim/harness/README.md), not a bug. `sim/` results are
# append-only evidence (CLAUDE.md) produced deliberately by a human or
# agent, never minted by a CI robot.
#
# Evidence-record *format* linting (the schema in sim/README.md) is step 4 of
# `.github/scripts/lint.sh` -- CI does not mint evidence, but it does check the
# shape of the evidence a PR adds, and enforces the append-only rule against
# the merge base.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tmds-encoder-verification:
    name: TMDS encoder (RTL + cocotb bench + negative control)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog and Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys
          iverilog -V
          yosys -V

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cocotb
        run: pip install -r verification/tmds_encoder/requirements.txt

      - name: Yosys elaboration smoke check (no vendor extensions)
        run: |
          yosys -p "read_verilog rtl/tmds_encoder.v; hierarchy -check -top tmds_encoder; check"

      - name: Run verification bench (real DUT) and negative control (broken DUT)
        # runner.py asserts BOTH legs: the real DUT must pass every test, and
        # the broken DUT (negative_control/tmds_encoder_broken.v) must FAIL
        # the same, unmodified test suite -- see verification/README.md.
        run: python3 verification/tmds_encoder/runner.py

  lint:
    name: Lint (shellcheck + syntax + evidence records)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The append-only evidence check (lint step 4/4) diffs against
          # `git merge-base origin/main HEAD`. The default depth-1 checkout has
          # neither origin/main nor enough history for a merge base, which would
          # silently downgrade that check to a SKIP -- hence full history.
          fetch-depth: 0

      - name: Lint
        # --require-shellcheck: shellcheck is preinstalled on GitHub's ubuntu
        # runner images, so a missing binary here means the image changed and
        # the shell scripts silently stopped being linted -- fail instead.
        # --require-append-only: same argument for the merge base -- if it stops
        # resolving, fail loudly instead of passing on a skipped check.
        # Same script `npm run lint` runs locally.
        run: .github/scripts/lint.sh --require-shellcheck --require-append-only

  test:
    name: Harness self-test (no PDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The harness is stdlib-only (sim/harness/README.md: python3 >= 3.9,
          # no venv, no packages), so there is nothing to install and no
          # dependency matrix to sweep -- one modern interpreter is the check.
          python-version: '3.12'

      - name: Testbench manifests load
        # `--list` deliberately keeps listing after a bad manifest, printing
        # `!!` instead of exiting non-zero, so grep for that marker: a malformed
        # tb.json must fail the PR, not surface at simulation time.
        run: |
          set -euo pipefail
          out="$(python3 sim/run_corners.py --list)"
          echo "$out"
          if grep -q '!!' <<<"$out"; then
            echo "::error::a testbench manifest failed to load (see the '!!' line above)"
            exit 1
          fi

      - name: Harness unit tests (no PDK, no ngspice required)
        run: python3 -m unittest discover -s sim/tests -v

      - name: LVS signoff-guard unit tests (no PDK, no klt required)
        # Covers layout/scripts/check_lvs_signoff.py, including the captured
        # klayout-tools#1196 report pair (layout/tests/fixtures/) in which a
        # deliberately-shorted negative control reported `status: match`.
        # The guard must reject that pair; if this test stops failing on it,
        # the guard has stopped guarding (issue #129).
        run: python3 -m unittest discover -s layout/tests -v

      - name: Environment check (informational -- no PDK on this runner)
        # sim/harness/README.md's documented contract: --check-env exits 3
        # and prints an actionable install hint when the PDK is absent. That
        # is not a CI failure; the PDK-required sweep runs on a developer or
        # agent box with the PDK installed (sim/env.sh, --check-env).
        run: python3 sim/run_corners.py --check-env || true
